name: Build Parent and Child APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project ZIP
        run: |
          test -f childpoints-project.zip
          mkdir -p build-src
          unzip -q childpoints-project.zip -d build-src
          rm -f build-src/.git* || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Parent APK
        run: gradle -p build-src/ParentApp :app:assembleDebug --no-daemon

      - name: Build Child APK
        run: gradle -p build-src/ChildApp :app:assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp build-src/ParentApp/app/build/outputs/apk/debug/app-debug.apk release-apks/ParentPoints-debug.apk
          cp build-src/ChildApp/app/build/outputs/apk/debug/app-debug.apk release-apks/ChildPoints-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: child-points-apks
          path: release-apks/*.apk
          if-no-files-found: error
