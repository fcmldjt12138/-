name: Build Parent and Child APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=\$ANDROID_HOME"
          which sdkmanager || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Parent APK
        run: gradle -p ParentApp :app:assembleDebug --no-daemon --stacktrace

      - name: Build Child APK
        run: gradle -p ChildApp :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp ParentApp/app/build/outputs/apk/debug/app-debug.apk release-apks/ParentPoints-debug.apk
          cp ChildApp/app/build/outputs/apk/debug/app-debug.apk release-apks/ChildPoints-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: child-points-apks
          path: release-apks/*.apk
          if-no-files-found: error
